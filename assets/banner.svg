<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 8s ease-in-out infinite alternate;
      }
      .pulse-node {
        animation: pulseNode 3s ease-in-out infinite alternate;
      }
      .flow-packet-1 {
        animation: flowPath1 5s linear infinite;
      }
      .flow-packet-2 {
        animation: flowPath2 6s linear infinite;
      }
      .radar-sweep {
        transform-origin: 1050px 210px;
        animation: rotateSweep 8s linear infinite;
      }
      
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -30px) scale(1.2); }
      }
      @keyframes pulseNode {
        0% { r: 4px; opacity: 0.6; }
        50% { r: 7px; opacity: 1; }
        100% { r: 4px; opacity: 0.6; }
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes flowPath1 {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes flowPath2 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Orbs in Background -->
  <circle cx="200" cy="120" r="160" fill="#0ea5e9" opacity="0.15" filter="url(#orbGlow)" class="glow-orb-1" />
  <circle cx="1020" cy="300" r="180" fill="#8b5cf6" opacity="0.18" filter="url(#orbGlow)" class="glow-orb-2" />
  <circle cx="600" cy="380" r="140" fill="#ec4899" opacity="0.12" filter="url(#orbGlow)" />

  <!-- Dynamic Cyber/Network Lines (Background / Framing) -->
  <g opacity="0.4">
    <!-- Top and bottom accent lines -->
    <path d="M 0 380 L 300 380 L 350 410 L 850 410 L 900 380 L 1200 380" fill="none" stroke="url(#textGrad)" stroke-width="1.5" />
    <path d="M 0 40 L 250 40 L 290 15 L 910 15 L 950 40 L 1200 40" fill="none" stroke="url(#textGrad)" stroke-width="1" stroke-opacity="0.5" />

    <!-- Flow paths simulating proxy packet streams -->
    <path d="M 100 350 C 350 350, 450 390, 700 360 C 950 330, 1050 380, 1150 370" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 16" class="flow-packet-1" />
    <path d="M 50 70 C 300 90, 500 50, 750 70 C 1000 90, 1100 60, 1180 70" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 12" class="flow-packet-2" />
  </g>

  <!-- Interactive Graphic / Proxy Inspection Node Diagram on the Right Side -->
  <g transform="translate(850, 60)" opacity="0.85">
    <!-- Outer radar circle -->
    <circle cx="180" cy="140" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="180" cy="140" r="75" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="180" cy="140" r="35" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

    <!-- Rotating radar arm -->
    <g class="radar-sweep" style="transform-origin: 180px 140px;">
      <line x1="180" y1="140" x2="290" y2="140" stroke="url(#accentCyan)" stroke-width="2" />
    </g>

    <!-- Proxy Node Cards -->
    <!-- Local Client -->
    <rect x="20" y="40" width="80" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="60" y="65" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">CLIENT</text>

    <!-- Proxy Agent (Center) -->
    <rect x="135" y="115" width="90" height="50" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
    <text x="180" y="138" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PROXY</text>
    <text x="180" y="153" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">AGENT / MITM</text>

    <!-- Cloud / Edge Tunnel -->
    <rect x="250" y="40" width="80" height="40" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="290" y="65" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TUNNEL</text>

    <!-- Connecting lines with nodes -->
    <line x1="100" y1="60" x2="135" y2="120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <line x1="225" y1="120" x2="250" y2="60" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 3" />

    <circle cx="100" cy="60" r="4" fill="#38bdf8" class="pulse-node" />
    <circle cx="250" cy="60" r="4" fill="#c084fc" class="pulse-node" />
    <circle cx="180" cy="140" r="5" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Foreground Content: Titles, Subtitles, Feature Badges (Always in crisp clear foreground) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="250" height="28" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" class="pulse-node" />
      <text x="28" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="170" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">Awesome Desktop API Proxy &amp; Agent</text>

    <!-- Subtitle -->
    <text x="0" y="212" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" letter-spacing="0.2">
      Traffic Interception • Local API Debugging • Secure Reverse Tunneling &amp; Edge Ingress
    </text>

    <!-- Tagline description -->
    <text x="0" y="245" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      The authoritative index of enterprise SaaS platforms and battle-tested open-source utilities.
    </text>

    <!-- Feature Pills / Badges -->
    <g transform="translate(0, 280)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4" fill="#38bdf8" />
        <text x="28" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ MITM Proxy</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="145" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4" fill="#818cf8" />
        <text x="28" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔍 SSL/TLS Inspect</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4" fill="#c084fc" />
        <text x="28" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 Secure Tunnels</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(460, 0)">
        <rect x="0" y="0" width="140" height="34" rx="17" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4" fill="#ec4899" />
        <text x="28" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ DAST &amp; AppSec</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(610, 0)">
        <rect x="0" y="0" width="140" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
        <circle cx="16" cy="17" r="4" fill="#10b981" />
        <text x="28" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚀 Local-First Mock</text>
      </g>
    </g>
  </g>
</svg>
